name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Ruff Lint Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Mypy
        run: uv run mypy src custom_components

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run Pytest & Contract Verification
        run: uv run --python ${{ matrix.python-version }} pytest -v

  build-and-compile:
    name: Build & Byte-Compile Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Byte-compile Python components (Zero Syntax Errors)
        run: |
          python3 -m compileall src custom_components tests

      - name: Build Python Distribution Packages (Wheel & SDist)
        run: uv build

      - name: Verify build artifacts
        run: ls -la dist/

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  validate-ha-component:
    name: Validate Home Assistant Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

      - name: HACS validation
        uses: "hacs/action@main"
        continue-on-error: true
        with:
          category: "integration"
