name: Bug Report
description: Report a bug, crash, or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve `toyota-connected`! Please fill out the information below.

        > [!CAUTION]
        > **DO NOT post real VINs, GPS coordinates, passwords, or raw session/refresh tokens.** Please redact them with `**REDACTED**`.

  - type: dropdown
    id: brand
    attributes:
      label: Vehicle Brand
      options:
        - Toyota
        - Lexus
        - Subaru (Solterra)
    validations:
      required: true

  - type: input
    id: model_year
    attributes:
      label: Model & Year
      placeholder: "e.g., 2024 Toyota bZ4X, 2023 Lexus NX 450h+, 2024 Subaru Solterra"
    validations:
      required: true

  - type: dropdown
    id: powertrain
    attributes:
      label: Powertrain Type
      options:
        - BEV (All-Electric)
        - PHEV (Plug-in Hybrid)
        - Hybrid (HEV)
        - ICE (Gasoline)
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Connected Services Region
      options:
        - Canada (CA)
        - United States (US)
        - Europe (TME / EU)
        - Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Integration version (e.g., v3.0.0), Home Assistant Core version (e.g., 2024.10.x)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What is happening versus what you expected to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Home Assistant Logs / Diagnostics
      description: |
        Paste relevant log entries from Settings -> System -> Logs or integration diagnostics.
        REMINDER: Ensure tokens, passwords, and GPS coordinates are redacted!
      render: text
