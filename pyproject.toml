[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toyota_connected"]

[project]
name = "toyota-connected"
version = "3.0.4"
description = "Unified Connected Services SDK and Home Assistant Integration for Toyota, Lexus, and Subaru vehicles with 12V battery drain protection."
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = { text = "MIT" }
authors = [
    { name = "Zachary Bergeron" }
]
keywords = ["home-assistant", "toyota", "lexus", "subaru", "solterra", "bz4x", "rz450e", "iot", "ev", "telematics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit[toml]>=1.7.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "vendor",
    "ha-toyota-na",
    "ha_toyota",
    "orienw-ha-toyota-na",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (Python 3.12+ modernization)
    "ASYNC",  # flake8-async hygiene
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter / long docstrings)
    "SIM108", # use ternary operator instead of if-else
    "RUF012", # mutable class attributes (common in HA entity definitions)
]

[tool.ruff.lint.isort]
known-first-party = ["toyota_connected", "custom_components.toyota_connected"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = [
    "vendor/.*",
    "ha-toyota-na/.*",
    "ha_toyota/.*",
    "orienw-ha-toyota-na/.*",
    "\\.venv/.*",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "vendor",
    "ha-toyota-na",
    "ha_toyota",
    "orienw-ha-toyota-na",
    ".venv",
]
skips = []
